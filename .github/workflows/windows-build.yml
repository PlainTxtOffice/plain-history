# Build the Windows release executables with the project's Nuitka scripts after
# CI passes, and keep them as workflow artifacts. Run it from the Actions tab or
# push a tag such as v0.2.0.
#
# The runner has free Nuitka from PyPI, so the scripts build without Nuitka
# Commercial and warn that constants are not encrypted and that the executable
# is unsigned. Use these artifacts to check that the release builds work;
# distribute the Commercial builds made locally. The installer needs a licensed
# Advanced Installer and is still built locally.
#
# Based on the project-vscode-template workflow, with the desktop window added
# and a CLI smoke test.
name: Windows build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Nuitka / ${{ matrix.variant }}
    needs: ci
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ship the complete .dist folder; it is the Advanced Installer payload.
          - variant: standalone
            output: build/standalone/*.dist
            executable: build/standalone/phist.dist/phist.exe
          # Ship the executable alone, without its staging folders.
          - variant: onefile
            output: build/onefile/*.exe
            executable: build/onefile/phist.exe
          # The desktop window opens no console, so it has no smoke test here.
          - variant: gui
            output: build/gui/*.dist
            executable: ""
    defaults:
      run:
        shell: pwsh
        working-directory: platform/windows
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install project and Nuitka
        # Keep the Nuitka version in step with the one used for local builds.
        run: .venv/Scripts/python.exe -m pip install -e . "nuitka[onefile]==4.2.2"

      - name: Build with Nuitka
        # standalone.ps1 and gui.ps1 also run validate_release.ps1.
        run: ./scripts/nuitka/${{ matrix.variant }}.ps1

      - name: Smoke-test the executable
        if: matrix.executable != ''
        run: "& ./${{ matrix.executable }} --help"

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ github.event.repository.name }}-${{ matrix.variant }}-windows-x64
          path: platform/windows/${{ matrix.output }}
          if-no-files-found: error
          retention-days: 30
